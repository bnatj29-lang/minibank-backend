services:
  mysql:
    image: mysql:8.0
    container_name: minibank-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mini2026
      MYSQL_DATABASE: minibank
    ports:
      # host:container -> por fora (na sua maquina) e 3307, por dentro do
      # container o MySQL continua na porta padrao 3306. E so isso que
      # "define a porta": nao existe passo separado de alterar depois.
      - "3308:3306"
    volumes:
      # Guarda os dados do banco fora do container, para nao perder tudo
      # se o container for recriado
      - minibank-mysql-data:/var/lib/mysql

volumes:
  minibank-mysql-data:
