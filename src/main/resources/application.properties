# Nome da aplicacao
spring.application.name=minibank-backend

# Porta em que a API vai rodar
server.port=${PORT:8080}

# Conexao com o banco de dados MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/minibank?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Executa automaticamente o schema.sql
spring.sql.init.mode=always

# Segredo usado para assinar os tokens JWT
minibank.jwt.secret=${MINIBANK_JWT_SECRET}
minibank.jwt.expiracao-ms=${MINIBANK_JWT_EXPIRACAO_MS:3600000}

# Recuperação de senha
minibank.resend.api-key=${MINIBANK_RESEND_API_KEY:}
minibank.resend.from=${MINIBANK_RESEND_FROM:MiniBank <onboarding@resend.dev>}
minibank.frontend.url=${MINIBANK_FRONTEND_URL:http://localhost:5173}