# Nome da aplicacao
spring.application.name=minibank-backend

# Porta em que a API vai rodar (http://localhost:8080)
server.port=8080

# Conexao com o banco de dados MySQL
# Ajuste responsavel/senha/nome do banco conforme o ambiente de cada um
spring.datasource.url=jdbc:mysql://localhost:3306/minibank?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Executa automaticamente o schema.sql (abaixo) toda vez que a aplicacao sobe.
# E aqui que a tabela "responsavel" e criada, sem depender do Hibernate.
spring.sql.init.mode=always
